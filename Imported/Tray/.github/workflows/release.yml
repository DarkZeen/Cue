name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-26

    # Lifted to the job so that step-level `if:` conditions can see them. A
    # step's own `env:` block is not in scope when its `if:` is evaluated, so
    # gating on it there silently skips the step even when the secret is set.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag is the single source of truth for the version; Info.plist is
      # stamped from it so the two can never disagree in a published build.
      - name: Stamp the version
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" \
            Resources/Info.plist

      - name: Test
        run: swift test

      # Signing credentials are optional. Without them the workflow still
      # produces a working, ad-hoc-signed disk image — a fork can cut a release
      # without an Apple Developer account.
      - name: Import the signing certificate
        id: signing
        if: env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: ./Scripts/build.sh

      - name: Create the disk image
        run: ./Scripts/create-dmg.sh --skip-build

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/Tray-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          # Stapling lets the image validate offline, on a Mac that has never
          # spoken to Apple's notarization service.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tray ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
