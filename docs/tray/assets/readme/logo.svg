<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Tray">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333740"/>
      <stop offset="1" stop-color="#131418"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FCFCFD"/>
      <stop offset="1" stop-color="#D9DADE"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
  <g clip-path="url(#plateClip)">
    <!-- The creature: one corner swept far more than the others, which is what
         stops it reading as a rounded rectangle. -->
    <path d="M 360 244 L 480 244 A 470 470 0 0 1 950 714 L 950 874 A 210 210 0 0 1 740 1084 L 360 1084 A 230 230 0 0 1 130 854 L 130 474 A 230 230 0 0 1 360 244 Z" fill="url(#body)"/>
    <!-- Eyes, leaning and deliberately mismatched. -->
    <rect x="-51" y="-107" width="102" height="214" rx="51" fill="#181A1E"
          transform="translate(466 606) rotate(16)"/>
    <rect x="-43" y="-88" width="86" height="176" rx="43" fill="#181A1E"
          transform="translate(672 556) rotate(16)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" ry="182" fill="none"
        stroke="#ffffff" stroke-opacity="0.13" stroke-width="6"/>
</svg>
